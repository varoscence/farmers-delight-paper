name: Build FarmersDelight Paper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn package -q

      - name: Build resource pack
        run: python3 generate_pack.py target/pack.zip

      - name: Prepare GitHub Pages content
        run: |
          mkdir -p target/pages
          cp target/pack.zip target/pages/
          cp target/pack.sha1 target/pages/

      - name: Deploy resource pack to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/pages
          publish_branch: gh-pages

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmersDelightPaper
          path: target/farmers-delight-paper-*.jar
          retention-days: 30
