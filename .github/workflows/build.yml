name: Build FarmersDelight Paper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn package -q

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmersDelightPaper
          path: target/farmers-delight-paper-*.jar
          retention-days: 30
