name: Build FarmersDelight Paper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Farmer's Delight textures
        run: |
          BASE="https://raw.githubusercontent.com/vectorwing/FarmersDelight/1.21/src/main/resources/assets/farmersdelight/textures/item"
          DEST="src/main/resources/textures/item"
          mkdir -p "$DEST"
          # Full texture list from FD 1.21 repo
          ITEMS=(
            "flint_knife" "iron_knife" "golden_knife" "diamond_knife" "netherite_knife"
            "cabbage" "cabbage_leaf" "cabbage_seeds" "cabbage_rolls"
            "tomato" "tomato_slice" "tomato_seeds"
            "onion" "onion_soup"
            "rice" "rice_panicle" "cooked_rice"
            "pumpkin_slice" "pumpkin_pie_slice" "pumpkin_soup"
            "wheat_dough" "cake_slice" "pie_crust"
            "raw_pasta" "pasta_with_meatballs" "pasta_with_mutton_chop" "squid_ink_pasta"
            "minced_beef" "beef_patty" "bacon" "cooked_bacon" "bacon_and_eggs" "bacon_sandwich"
            "ham" "smoked_ham" "honey_glazed_ham"
            "mutton_chops" "cooked_mutton_chops" "roasted_mutton_chops" "mutton_wrap"
            "chicken_cuts" "cooked_chicken_cuts" "chicken_soup" "chicken_sandwich"
            "salmon_roll" "salmon_slice" "cooked_salmon_slice" "grilled_salmon"
            "cod_slice" "cooked_cod_slice" "cod_roll"
            "kelp_roll" "kelp_roll_slice"
            "beef_stew" "fish_stew" "vegetable_soup" "noodle_soup" "baked_cod_stew"
            "mushroom_rice" "ratatouille" "mixed_salad" "fruit_salad"
            "gleaming_salad" "nether_salad" "steak_and_potatoes"
            "stuffed_potato" "stuffed_pumpkin"
            "dumplings" "egg_sandwich" "barbecue_stick"
            "bone_broth" "glow_berry_custard"
            "hamburger" "fried_egg" "fried_rice"
            "rice_bowl" "roast_chicken" "roast_chicken_block"
            "vegetable_noodles" "sweet_berry_cookie" "honey_cookie"
            "sweet_berry_cheesecake_slice" "apple_pie" "apple_pie_slice"
            "chocolate_pie_slice" "shepherds_pie"
            "hot_cocoa" "apple_cider" "melon_juice" "melon_popsicle" "milk_bottle"
            "tomato_sauce" "dog_food" "horse_feed"
            "straw" "canvas" "rope" "tree_bark" "rotten_tomato"
            "cooking_pot" "ham_slice"
          )
          for item in "${ITEMS[@]}"; do
            curl -sf "$BASE/$item.png" -o "$DEST/$item.png" || true
          done
          echo "Downloaded $(ls $DEST | wc -l) textures"

      - name: Build with Maven
        run: mvn package -q

      - name: Build resource pack
        run: python3 generate_pack.py target/pack.zip

      - name: Prepare GitHub Pages content
        run: |
          mkdir -p target/pages
          cp target/pack.zip target/pages/
          cp target/pack.sha1 target/pages/

      - name: Deploy resource pack to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/pages
          publish_branch: gh-pages

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmersDelightPaper
          path: target/farmers-delight-paper-*.jar
          retention-days: 30
