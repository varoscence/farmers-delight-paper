# Farmer's Delight Paper - Config
#
# resource-pack-url: URL to the resource pack ZIP (GitHub Pages by default).
#   The pack is also bundled inside the JAR, so once the Netty injector is
#   working on your host you can clear this and use resource-pack-host instead.
resource-pack-url: "https://varoscence.github.io/farmers-delight-paper/pack.zip"

# resource-pack-host: your server's external IP.
#   Only used when resource-pack-url is empty (self-hosted via game port).
resource-pack-host: "136.175.187.108"
